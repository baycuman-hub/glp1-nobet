# Yeni depoda şu yola kopyalanır: .github/workflows/nobet.yml
# Günde iki çekim (NosyAPI'nin önerisi): 10.15 ve 19.45 Türkiye saati = 07.15 ve 16.45 UTC
# (Türkiye yaz saati uygulamaz). Her çekim 81 kredi; elle çalıştırma da 81 kredi harcar.
# Şifreli dosyalar `yayin` dalına tek kayıt olarak yazılır, eski listeler geçmişte birikmez.
# Pages bu daldan yayınlar: Settings > Pages > Deploy from a branch > yayin / (root).
name: Nöbetçi eczane listesi

on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nobet
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Şifreleme paketini kur
        run: pip install cryptography==44.0.2
      - name: Önceki yayını al
        # Sağlayıcıda bir il boş gelirse betik o ilin eski dosyasını korur; bunun için önceki yayın gerekir.
        # ls-remote çıkış kodu: 0 = dal var, 2 = dal yok (ilk çalıştırma), başkası = ağ hatası (iş durur).
        run: |
          mkdir -p cikti
          kod=0; git ls-remote --exit-code --heads origin yayin > /dev/null || kod=$?
          if [ "$kod" = 0 ]; then
            git fetch --depth=1 origin yayin
            git archive FETCH_HEAD | tar -x -C cikti
          elif [ "$kod" = 2 ]; then
            echo "İlk çalıştırma: yayin dalı henüz yok."
          else
            exit "$kod"
          fi
      - name: Listeyi çek, şifrele, il dosyalarını yaz
        env:
          NOSYAPI_KEY: ${{ secrets.NOSYAPI_KEY }}
          NOBET_ANAHTAR: ${{ secrets.NOBET_ANAHTAR }}
        run: python3 nobet_cek.py --cikti cikti
      - name: Yayın dalına gönder
        working-directory: cikti
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b yayin
          git config user.name "nobet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Nöbet listesi $(TZ=Europe/Istanbul date +'%d.%m.%Y %H.%M')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yayin
